<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取验证码</title>
    <style>
        .result-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #copyBtn {
            padding: 5px 10px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #copyBtn:hover {
            background-color: #e0e0e0;
        }
        .status {
            color: #666;
            font-size: 0.9em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>获取验证码</h1>
    
    <div>
        <label for="password">输入Key:</label>
        <input type="text" id="password" value="">
        <button onclick="encrypt()">确定</button>
        <span id="clipboardStatus" class="status"></span>
    </div>
    
    <div class="result-container">
        <p>验证码: <span id="result"></span></p>
        <button id="copyBtn" onclick="copyResult()">复制</button>
    </div>

    <script>
        class SimplePasswordEncryptor {
            static DEFAULT_SALT = "weaver";

            static async encryptToSixDigit(input) {
                return this._encryptToSixDigit(input, this.DEFAULT_SALT);
            }

            static async _encryptToSixDigit(input, salt) {
                try {
                    const data = input + salt;
                    const hashBytes = await this.sha256(data);
                    return this.bytesToSixDigit(hashBytes);
                } catch (error) {
                    throw new Error("生成验证码失败: " + error.message);
                }
            }

            static async sha256(message) {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                return new Uint8Array(hashBuffer);
            }

            static bytesToSixDigit(bytes) {
                let value = BigInt(0);
                const length = Math.min(8, bytes.length);
                
                for (let i = 0; i < length; i++) {
                    value = (value << 8n) | BigInt(bytes[i] & 0xFF);
                }
                
                const absValue = value < 0 ? -value : value;
                const sixDigit = Number(absValue % 1000000n);
                return sixDigit.toString().padStart(6, '0');
            }
        }

        async function encrypt() {
            const input = document.getElementById('password').value;
            try {
                const result = await SimplePasswordEncryptor.encryptToSixDigit(input);
                document.getElementById('result').textContent = result;
            } catch (error) {
                document.getElementById('result').textContent = "错误: " + error.message;
            }
        }

        function copyResult() {
            const resultText = document.getElementById('result').textContent;
            if (!resultText) {
                alert('没有可复制的内容');
                return;
            }
            
            navigator.clipboard.writeText(resultText)
                .then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.textContent = '已复制';
                    setTimeout(() => {
                        copyBtn.textContent = '复制';
                    }, 2000);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                });
        }

        // 从剪贴板读取内容并填充到输入框
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('password').value = text;
                    document.getElementById('clipboardStatus').textContent = '已从剪贴板粘贴';
                    setTimeout(() => {
                        document.getElementById('clipboardStatus').textContent = '';
                    }, 2000);
                }
            } catch (error) {
                console.log('无法读取剪贴板:', error);
                // 如果权限被拒绝，显示提示信息
                if (error.name === 'NotAllowedError') {
                    document.getElementById('clipboardStatus').textContent = '剪贴板访问被拒绝';
                    setTimeout(() => {
                        document.getElementById('clipboardStatus').textContent = '';
                    }, 2000);
                }
            }
        }
    </script>
</body>
</html>
